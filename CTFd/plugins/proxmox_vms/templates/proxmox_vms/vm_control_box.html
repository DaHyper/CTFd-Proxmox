{% if challenge_has_vm(challenge.id) %}
<div class="card mt-3">
    <div class="card-header">
        <h5><i class="fas fa-server"></i> Virtual Machine</h5>
    </div>
    <div class="card-body" id="vm-control-box">
        <div class="row">
            <div class="col-md-6">
                <p><strong>Status:</strong> <span id="vm-status" class="badge badge-secondary">Not Created</span></p>
                <p id="vm-ip-row" style="display:none"><strong>IP Address:</strong> <code id="vm-ip">-</code></p>
            </div>
            <div class="col-md-6">
                <p id="vm-time-row" style="display:none"><strong>Time Left:</strong> <span id="vm-remaining-time">-</span></p>
            </div>
        </div>

        <div class="mt-2">
            <button class="btn btn-success vm-btn" id="vm-create-btn" onclick="createVM()">
                <i class="fas fa-plus"></i> Create VM
            </button>

            <div id="vm-control-buttons" style="display:none">
                <button class="btn btn-primary btn-sm vm-btn" id="vm-start-btn"   onclick="vmPower('start')"><i class="fas fa-play"></i> Start</button>
                <button class="btn btn-warning btn-sm vm-btn" id="vm-stop-btn"    onclick="vmPower('stop')"><i class="fas fa-stop"></i> Stop</button>
                <button class="btn btn-info    btn-sm vm-btn" id="vm-restart-btn" onclick="vmPower('restart')"><i class="fas fa-redo"></i> Restart</button>
                <button class="btn btn-dark    btn-sm vm-btn" id="vm-console-btn" onclick="openConsole()" style="display:none">
                    <i class="fas fa-terminal"></i> Console
                </button>
            </div>
        </div>

        <div id="vm-loading" class="mt-2" style="display:none">
            <div class="spinner-border spinner-border-sm" role="status"></div>
            <span id="vm-loading-text">Processing...</span>
        </div>
        <div id="vm-error" class="alert alert-danger mt-2" style="display:none"></div>
    </div>
</div>

<script>
(function() {
    var csrfNonce = init.csrfNonce;
    var statusInterval = null;

    function apiGet(url) {
        return fetch(url, {
            headers: { 'CSRF-Token': csrfNonce }
        }).then(function(r) { return r.json(); });
    }

    function apiPost(url) {
        return fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'CSRF-Token': csrfNonce
            }
        }).then(function(r) { return r.json(); });
    }

    document.addEventListener('DOMContentLoaded', function() {
        checkExistingVM();
    });

    // Also check on Alpine/modal open since challenge.html may load dynamically
    setTimeout(checkExistingVM, 500);

    function checkExistingVM() {
        apiGet('/proxmox/vm/status').then(function(r) {
            if (r.success && r.vm) {
                updateDisplay(r.vm);
                startPolling();
            }
        }).catch(function() {});
    }

    window.createVM = function() {
        showLoading('Creating VM... This may take a minute');
        apiPost('/proxmox/vm/create').then(function(r) {
            if (r.success) { updateDisplay(r.vm); hideLoading(); startPolling(); }
            else showError(r.error || 'Failed to create VM');
        }).catch(function() {
            showError('Failed to create VM');
        });
    };

    window.vmPower = function(action) {
        showLoading(action.charAt(0).toUpperCase() + action.slice(1) + 'ing VM...');
        apiPost('/proxmox/vm/power/' + action).then(function(r) {
            if (r.success) { updateDisplay(r.vm); hideLoading(); }
            else showError(r.error || 'Action failed');
        }).catch(function() {
            showError('Action failed');
        });
    };

    window.openConsole = function() {
        apiPost('/proxmox/vnc').then(function(r) {
            if (!r.success) { alert(r.error || 'Could not get console'); return; }
            var viewerUrl = '/plugins/proxmox_vms/assets/novnc/viewer.html'
                + '?ws_url=' + encodeURIComponent(r.ws_url)
                + '&ticket=' + encodeURIComponent(r.ticket)
                + '&host=' + encodeURIComponent(r.proxmox_host);
            window.open(viewerUrl, 'vm_console', 'width=1280,height=800,menubar=no,toolbar=no');
        }).catch(function() { alert('Failed to open console'); });
    };

    function updateDisplay(vm) {
        var badge = document.getElementById('vm-status');
        badge.className = 'badge';

        if (vm.status === 'running') {
            badge.classList.add('badge-success');
            badge.textContent = 'Running';
            document.getElementById('vm-start-btn').disabled = true;
            document.getElementById('vm-stop-btn').disabled = false;
            document.getElementById('vm-restart-btn').disabled = false;
            document.getElementById('vm-console-btn').style.display = '';
        } else if (vm.status === 'stopped') {
            badge.classList.add('badge-danger');
            badge.textContent = 'Stopped';
            document.getElementById('vm-start-btn').disabled = false;
            document.getElementById('vm-stop-btn').disabled = true;
            document.getElementById('vm-restart-btn').disabled = true;
            document.getElementById('vm-console-btn').style.display = 'none';
        } else {
            badge.classList.add('badge-warning');
            badge.textContent = vm.status;
            document.getElementById('vm-console-btn').style.display = 'none';
        }

        document.getElementById('vm-create-btn').style.display = 'none';
        document.getElementById('vm-control-buttons').style.display = '';

        if (vm.vm_ip) {
            document.getElementById('vm-ip').textContent = vm.vm_ip;
            document.getElementById('vm-ip-row').style.display = '';
        }
        if (vm.remaining_time_formatted) {
            document.getElementById('vm-remaining-time').textContent = vm.remaining_time_formatted;
            document.getElementById('vm-time-row').style.display = '';
        }
    }

    function startPolling() {
        if (statusInterval) clearInterval(statusInterval);
        statusInterval = setInterval(function() {
            apiGet('/proxmox/vm/status').then(function(r) {
                if (r.success && r.vm) updateDisplay(r.vm);
            }).catch(function() {});
        }, 10000);
    }

    function showLoading(text) {
        document.getElementById('vm-loading-text').textContent = text;
        document.getElementById('vm-loading').style.display = '';
        var btns = document.querySelectorAll('#vm-control-box .vm-btn');
        for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
        document.getElementById('vm-error').style.display = 'none';
    }

    function hideLoading() {
        document.getElementById('vm-loading').style.display = 'none';
        var btns = document.querySelectorAll('#vm-control-box .vm-btn');
        for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
    }

    function showError(message) {
        var el = document.getElementById('vm-error');
        el.textContent = message;
        el.style.display = '';
        hideLoading();
    }
})();
</script>
{% endif %}
